<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>全國熱門宮廟</title>
<meta property="og:title" content="全國熱門宮廟">

<meta property="og:type" content="website">
<meta property="og:url" content="https://andrea01012020-byte.github.io/national-popular-temples/">

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#eee}
.wrap{position:relative;max-width:900px;width:100%;margin:auto}
img{display:block;width:100%;height:auto}
.hotspot{position:absolute;border:0;background:transparent;border-radius:14px;cursor:pointer}
.hotspot:active{background:rgba(255,215,0,.35)}
.hotspot.flash{animation:flash .5s ease}
@keyframes flash{
  0%{background:rgba(255,215,0,.08)}
  50%{background:rgba(255,215,0,.55);box-shadow:0 0 26px #ffd700}
  100%{background:transparent}
}
</style>
</head>
<body>
<audio id="bgm" loop preload="none"><source src="music.mp3" type="audio/mpeg"></audio>
<div class="wrap" id="wrap">
  <img src="preview.png" alt="全國熱門宮廟互動式Q版地圖">
  <button class="hotspot" type="button" aria-label="正統鹿耳門聖母廟，前往官方網站" data-url="https://luermen.org.tw" style="left:2.5%;top:18.9299%;width:35%;height:11.3579%"></button><button class="hotspot" type="button" aria-label="北港朝天宮，前往官方網站" data-url="https://www.matsu.org.tw" style="left:2.5%;top:30.3960%;width:35%;height:11.3579%"></button><button class="hotspot" type="button" aria-label="北港武德宮，前往官方網站" data-url="https://www.wude.org.tw" style="left:2.5%;top:41.9702%;width:35%;height:11.2498%"></button><button class="hotspot" type="button" aria-label="南鯤鯓代天府，前往官方網站" data-url="https://www.nkstemple.org.tw" style="left:2.5%;top:53.3282%;width:35%;height:11.3579%"></button><button class="hotspot" type="button" aria-label="西螺福興宮，前往官方網站" data-url="https://www.taipingmatzu.org.tw" style="left:62.2%;top:18.9299%;width:35%;height:11.3579%"></button><button class="hotspot" type="button" aria-label="佛光山，前往官方網站" data-url="https://www.fgs.org.tw" style="left:62.2%;top:30.3960%;width:35%;height:11.3579%"></button><button class="hotspot" type="button" aria-label="麻豆代天府，前往官方網站" data-url="https://www.5god.com.tw" style="left:62.2%;top:41.9702%;width:35%;height:11.2498%"></button><button class="hotspot" type="button" aria-label="車城福安宮，前往官方網站" data-url="https://www.fuantmp.org" style="left:62.2%;top:53.3282%;width:35%;height:11.3579%"></button><button class="hotspot" type="button" aria-label="台北行天宮，前往官方網站" data-url="https://www.ht.org.tw" style="left:2.5%;top:71.3927%;width:35%;height:8.8700%"></button><button class="hotspot" type="button" aria-label="艋舺龍山寺，前往官方網站" data-url="https://www.lungshan.org.tw" style="left:2.5%;top:80.2627%;width:35%;height:8.8700%"></button><button class="hotspot" type="button" aria-label="北港朝天宮，前往官方網站" data-url="https://www.matsu.org.tw" style="left:2.5%;top:89.1327%;width:35%;height:8.8700%"></button><button class="hotspot" type="button" aria-label="大甲鎮瀾宮，前往官方網站" data-url="https://www.dajiamazu.org.tw" style="left:2.5%;top:98.0027%;width:35%;height:9.5190%"></button><button class="hotspot" type="button" aria-label="竹山紫南宮，前往官方網站" data-url="https://www.xn--6kry7q182a.tw" style="left:62.2%;top:71.3927%;width:35%;height:8.8700%"></button><button class="hotspot" type="button" aria-label="車城福安宮，前往官方網站" data-url="https://www.fuantmp.org" style="left:62.2%;top:80.2627%;width:35%;height:8.8700%"></button><button class="hotspot" type="button" aria-label="白沙屯拱天宮，前往官方網站" data-url="https://www.baishatunmazu.org.tw" style="left:62.2%;top:89.1327%;width:35%;height:8.8700%"></button><button class="hotspot" type="button" aria-label="南鯤鯓代天府，前往官方網站" data-url="https://www.nkstemple.org.tw" style="left:62.2%;top:98.0027%;width:35%;height:9.5190%"></button>
</div>
<script>
const bgm=document.getElementById('bgm');
let musicStarted=false;
document.querySelectorAll('.hotspot').forEach(b=>{
  b.addEventListener('click',async()=>{
    b.classList.remove('flash');
    void b.offsetWidth;
    b.classList.add('flash');
    if(!musicStarted){
      try{bgm.volume=.28;await bgm.play();musicStarted=true}catch(e){}
    }
    setTimeout(()=>window.open(b.dataset.url,'_blank','noopener'),180);
  });
});
</script>

</body>
</html>
